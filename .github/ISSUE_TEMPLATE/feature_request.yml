name: Feature request / 功能建议
description: Describe the conversation problem you want to solve.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you need?
      description: Describe a concrete situation using fictional or anonymized details.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What would a successful result look like?
    validations:
      required: true
